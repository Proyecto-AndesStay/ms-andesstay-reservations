server.port=8081

# Conexión a la Base de Datos MySQL en Docker
spring.datasource.url=jdbc:mysql://andesstay-db:3306/andesstay_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate - Creará las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seguridad
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/df536a4e-3386-4046-9c97-d8e41c89806d/
spring.security.oauth2.resourceserver.jwt.audiences=api://086deb4c-cded-42b0-8dfb-ab7cdb7e0346

# ==========================================
# Configuración Centralizada de RabbitMQ (AndesStay)
# ==========================================
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Exchanges según caso AndesStay (Sección 8)
andesstay.rabbitmq.exchanges.direct=cmd.direct
andesstay.rabbitmq.exchanges.topic=cmd.topic
andesstay.rabbitmq.exchanges.dlx=cmd.dead.dlx

# Colas Principales y DLQs
andesstay.rabbitmq.queues.email=q.cmd.email
andesstay.rabbitmq.queues.email-dlq=q.cmd.email.dlq
andesstay.rabbitmq.queues.housekeeping=q.cmd.housekeeping
andesstay.rabbitmq.queues.housekeeping-dlq=q.cmd.housekeeping.dlq
andesstay.rabbitmq.queues.voucher=q.cmd.voucher
andesstay.rabbitmq.queues.voucher-dlq=q.cmd.voucher.dlq

# Routing Keys
andesstay.rabbitmq.routing-keys.email-send=email.send
andesstay.rabbitmq.routing-keys.housekeeping-ticket=housekeeping.ticket
andesstay.rabbitmq.routing-keys.voucher-gen=voucher.gen
andesstay.rabbitmq.routing-keys.dlq=dlq.routing.key